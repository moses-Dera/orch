services:
  - type: web
    name: orch-core
    env: docker
    dockerfilePath: ./Dockerfile.core
    region: ohio # Default US region
    plan: free # Can upgrade to pro later
    healthCheckPath: / # A ping endpoint
    envVars:
      - key: DATABASE_URL
        sync: false

      - key: TRIAL_API_KEY
        sync: false
      - key: TRIAL_PROVIDER
        sync: false
      - key: TRIAL_MODEL
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: ORCH_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
